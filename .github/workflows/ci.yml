name: CI

on:
  push:          # run on every push to any branch
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop --parallel
        continue-on-error: true

  # The live AF_PACKET backend needs CAP_NET_RAW, which GitHub runners
  # allow for the loopback device. This smoke test exercises the real
  # socket path end to end over `lo`.
  live-loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Live loopback smoke test
        run: sudo ruby -Ilib test/live/smoke_linux.rb
